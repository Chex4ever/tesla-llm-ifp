name: tesla-llm

services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      DOMAIN_ROOT: ${DOMAIN_ROOT}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - fleet-api
      - fleet-ui
      - gateway
      - grafana
      - open-webui
      - minio
      - registry
      - headscale
    networks:
      - tesla

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tesla

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tesla

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command:
      - "--js"
      - "--sd=/data"
      - "--auth=${NATS_TOKEN}"
      - "--http_port=8222"
    ports:
      # Agents connect outbound from NAT using PUBLIC_NATS_URL
      - "4222:4222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tesla

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tesla

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/$${MINIO_BUCKET_MODELS} || true;
      mc mb -p local/$${MINIO_BUCKET_AGENTS} || true;
      mc anonymous set none local/$${MINIO_BUCKET_MODELS};
      mc anonymous set none local/$${MINIO_BUCKET_AGENTS};
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_MODELS: ${MINIO_BUCKET_MODELS}
      MINIO_BUCKET_AGENTS: ${MINIO_BUCKET_AGENTS}
    networks:
      - tesla
    restart: "no"

  headscale:
    image: headscale/headscale:0.25.1
    restart: unless-stopped
    command: serve
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./headscale/acl.yaml:/etc/headscale/acl.yaml:ro
      - headscale_data:/var/lib/headscale
    ports:
      - "41641:41641/udp"
      - "3478:3478/udp"
    networks:
      - tesla

  registry:
    image: registry:2
    restart: unless-stopped
    environment:
      REGISTRY_HTTP_SECRET: ${REGISTRY_HTTP_SECRET}
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - tesla

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - tesla

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN_ROOT}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - tesla

  open-webui:
    image: ghcr.io/open-webui/open-webui:0.5.20
    restart: unless-stopped
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      OPENAI_API_BASE_URL: http://gateway:8080/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ENABLE_OLLAMA_API: "false"
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      - gateway
    networks:
      - tesla

  fleet-api:
    build:
      context: ..
      dockerfile: apps/fleet-api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      HTTP_ADDR: ":8081"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NATS_URL: nats://nats:4222
      NATS_TOKEN: ${NATS_TOKEN}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_MODELS: ${MINIO_BUCKET_MODELS}
      MINIO_BUCKET_AGENTS: ${MINIO_BUCKET_AGENTS}
      MINIO_USE_SSL: "false"
      HEADSCALE_URL: http://headscale:8080
      HEADSCALE_API_KEY: ${HEADSCALE_API_KEY:-}
      PUBLIC_FLEET_URL: ${PUBLIC_FLEET_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      PUBLIC_HS_URL: ${PUBLIC_HS_URL}
      PUBLIC_NATS_URL: ${PUBLIC_NATS_URL}
      NATS_TOKEN: ${NATS_TOKEN}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET}
      OPENAI_BOOTSTRAP_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      headscale:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - tesla

  fleet-ui:
    build:
      context: ../apps/fleet-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - tesla

  gateway:
    build:
      context: ..
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NATS_URL: nats://nats:4222
      NATS_TOKEN: ${NATS_TOKEN}
      FLEET_API_URL: http://fleet-api:8081
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      fleet-api:
        condition: service_started
    networks:
      - tesla

  node-exporter:
    image: prom/node-exporter:v1.9.0
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks:
      - tesla

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - tesla

networks:
  tesla:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  nats_data:
  minio_data:
  headscale_data:
  registry_data:
  prometheus_data:
  grafana_data:
  openwebui_data:
